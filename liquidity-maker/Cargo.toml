[package]
name = "event-contract-liquidity-maker"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
license = "MIT"
publish = false
description = "Polymarket to LightPool liquidity maker for event-contract-app"

[[bin]]
name = "liquidity-maker"
path = "src/bin/liquidity_maker.rs"

[dependencies]
nautilus-trading = { path = "../../lightpool-bot/crates/trading" }
nautilus-common = { path = "../../lightpool-bot/crates/common", features = ["live"] }
nautilus-model = { path = "../../lightpool-bot/crates/model", features = ["stubs"] }
nautilus-core = { path = "../../lightpool-bot/crates/core" }
nautilus-live = { path = "../../lightpool-bot/crates/live", features = ["node"] }
nautilus-polymarket = { path = "../../lightpool-bot/crates/adapters/polymarket" }
nautilus-lightpool = { path = "../../lightpool-bot/crates/adapters/lightpool" }
nautilus-network = { path = "../../lightpool-bot/crates/network" }

ahash = { version = "0.8.12", features = ["serde"] }
anyhow = "1.0.102"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
indexmap = { version = "2.14.0", features = ["serde"] }
rust_decimal = { version = "1.42.1", features = ["serde-with-float"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
clap = { version = "4.5", features = ["derive"] }
dotenvy = "0.15"
log = "0.4.32"
tokio = { version = "1.52.3", features = ["full"] }
